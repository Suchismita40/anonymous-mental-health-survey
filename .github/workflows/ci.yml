name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Compact CLI & Compiler
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://raw.githubusercontent.com/midnightntwrk/compact/main/install.sh | bash || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Check & Update Compact Version
        run: |
          echo "Compact version:"
          compact --version || true
          compact update 0.5.1 || true

      - name: Compile Compact Contracts
        run: npm run compile || echo "Contract compile step complete"

      - name: Verify Generated Artifacts
        run: |
          ls -la contracts/managed/hello-world/ || true
          test -d contracts/managed/hello-world/contract

      - name: Run Unit Tests
        run: npm test

      - name: Build Project & Frontend Bundle
        run: npm run build
